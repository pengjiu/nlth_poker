[project]
name = "poker2"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pokerkit==0.7.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=poker2 --cov-report=term-missing:skip-covered --cov-fail-under=95"

[tool.coverage.run]
omit = [
  "poker2/cli/*",
  "poker2/contractkit/_generated.py",
  "poker2/engines/__init__.py",
  "poker2/engines/postflop_solver.py",
  "poker2/environment/__init__.py",
  "poker2/data/__init__.py",
]
